server:
  port: 8081
spring:
  application:
    name: enrollment-service

  datasource:
    url: ${SPRING_DATASOURCE_ENROLLMENT_URL}
    username: ${ENROLLMENT_DB_USER}
    password: ${ENROLLMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration